    <!-- ========================================================================= -->
    <!-- 1. CAPTURADOR DE ERRORES DE RED Y CDNs (Inyectado primero que nada)       -->
    <!-- ========================================================================= -->
    <script>
        window.addEventListener('error', function (e) {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                const resource = e.target.src || e.target.href;
                document.title = '🚨 CDN BLOQUEADO';
                console.error('Fallo al cargar recurso:', resource);

                window.addEventListener('DOMContentLoaded', () => {
                    const errorBox = document.getElementById('error-box');
                    const errorMsg = document.getElementById('error-message');
                    if (errorBox && errorMsg) {
                        errorBox.style.display = 'block';
                        errorMsg.innerHTML += `<br/><b>❌ Recurso Bloqueado:</b> No se pudo cargar <code>${resource}</code>.<br/><span style="color:#b91c1c; font-size: 14px;">👉 <b>Posible Solución:</b> Si usas un bloqueador de anuncios (AdBlock, uBlock, Brave Shield), desactívalo para esta página. Si estás en una red corporativa/hospital, prueba usar los datos del celular.</span><br/>`;
                    }
                });
            }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
            window.addEventListener('DOMContentLoaded', () => {
                const errorBox = document.getElementById('error-box');
                const errorMsg = document.getElementById('error-message');
                if (errorBox && errorMsg) {
                    errorBox.style.display = 'block';
                    errorMsg.innerHTML += `<br/><b>⚠️ Error de Ejecución (Línea ${lineno}):</b> ${message}<br/>`;
                }
            });
        };
    </script>

            const currentMonthYYYYMM = `${currentYear}-${String(currentMonthNum).padStart(2, '0')}`;

            const lastMonthNum = currentMonthNum === 1 ? 12 : currentMonthNum - 1;
            const lastMonthYear = currentMonthNum === 1 ? currentYear - 1 : currentYear;
            const lastMonthYYYYMM = `${lastMonthYear}-${String(lastMonthNum).padStart(2, '0')}`;

            const getMonthName = (yyyymm) => {
                if (!yyyymm) return '';
                const [year, month] = yyyymm.split('-');
                const date = new Date(year, month - 1, 1);
                return date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).replace(/^\w/, c => c.toUpperCase());

            const getAllActivitiesFlat = (config, customProcedures = []) => {
                return [
                    ...config.planta,
                    ...config.guardia,
                    ...customProcedures,
                    ...config.clases_dictadas,
                    ...config.clases_escuchadas,
                    ...config.otras_actividades,
                    ...config.gestion
                ];

            const getMonthProgress = (residentId, yyyymm, logsList, evaluations, proceduresList = [], config) => {
                const monthLogs = logsList.filter(l => l.residentId === residentId && l.date.startsWith(yyyymm) && !l.anulado);
                const allActs = getAllActivitiesFlat(config, proceduresList);

                let isApproved = true;
                const missing = [];

                const evalKey = `${residentId}_${yyyymm}`;
                const evalObj = evaluations[evalKey];
                const staffScore = typeof evalObj === 'object' ? (evalObj?.score || 0) : (Number(evalObj) || 0);

                const gestIds = config.gestion.map(a => a.id);

                const goalsProgress = GOALS.map(goal => {
                    let currentPoints = 0;

                    if (goal.category === 'planta') {
                        const plantaActsIds = config.planta.map(a => a.id);
                        const plantaPts = monthLogs.filter(l => plantaActsIds.includes(l.activityId)).reduce((sum, l) => {

                            return sum + (act ? act.points * l.qty : 0);
                        }, 0);

                        const guardiaActsIds = config.guardia.map(a => a.id);
                        const guardiaPts = monthLogs.filter(l => guardiaActsIds.includes(l.activityId)).reduce((sum, l) => {
                            const act = allActs.find(a => a.id === l.activityId);
                            return sum + (act ? act.points * l.qty : 0);
                        }, 0);

                        currentPoints = plantaPts + guardiaPts;
                    } else if (goal.category === 'guardia') {
                        const actsIds = config.guardia.map(a => a.id);
                        currentPoints = monthLogs.filter(l => actsIds.includes(l.activityId)).reduce((sum, l) => {
                            const act = allActs.find(a => a.id === l.activityId);
                            return sum + (act ? act.points * l.qty : 0);
                        }, 0);
                    } else if (goal.category === 'procedimientos') {
                        const procIds = proceduresList.map(a => a.id);
                        currentPoints = monthLogs.filter(l => procIds.includes(l.activityId)).reduce((sum, l) => {
                            const act = proceduresList.find(a => a.id === l.activityId);
                            return sum + (act ? act.points * l.qty : 0);
                        }, 0);
                    } else if (goal.category === 'academica') {
                        const acadActs = [...config.clases_dictadas, ...config.clases_escuchadas, ...config.otras_actividades].map(a => a.id);
                        currentPoints = monthLogs.filter(l => acadActs.includes(l.activityId)).reduce((sum, l) => {
                            const act = allActs.find(a => a.id === l.activityId);
                            return sum + (act ? act.points * l.qty : 0);
                        }, 0);
                    } else if (goal.category === 'clase_prep') {
                        const dictadasIds = config.clases_dictadas.map(a => a.id);
                        currentPoints = monthLogs.filter(l => dictadasIds.includes(l.activityId)).reduce((sum, l) => sum + l.qty, 0);
                    } else if (goal.category === 'gestion') {
                        const gestLogs = monthLogs.filter(l => gestIds.includes(l.activityId));
                        if (gestLogs.length > 0) {
                            const scores = gestLogs.map(l => {
                                const act = allActs.find(a => a.id === l.activityId);
                                return act ? act.points : 0;
                            });
                            currentPoints = Math.max(...scores);
                        } else {
                            currentPoints = 0;
                        }
                    } else if (goal.category === 'evaluacion_medico') {
                        currentPoints = staffScore;
                    }

                    const roundedPoints = Math.round(currentPoints * 100) / 100;

                    if (goal.category === 'evaluacion_medico') {
                        if (staffScore <= 4) {
                            isApproved = false;
                            const reason = staffScore === 0 ? 'Pendiente (habilitada desde el día 25)' : 'Puntaje <= 4 (otorgado: ' + staffScore + ')';
                            missing.push({ name: 'Evaluación del Médico de Planta', lacking: reason });
                        }
                    } else if (goal.requiredPoints > 0 && roundedPoints < goal.requiredPoints) {
                        isApproved = false;
                        missing.push({ name: goal.name, lacking: Math.round((goal.requiredPoints - roundedPoints) * 100) / 100 });
                    }

                    return { ...goal, currentPoints: roundedPoints };
                });

                let totalPointsOverall = 0;
                const nonGestLogs = monthLogs.filter(l => !gestIds.includes(l.activityId));
                nonGestLogs.forEach(l => {
                    const act = allActs.find(a => a.id === l.activityId);
                    if (act) totalPointsOverall += (act.points * l.qty);
                });

                const gestLogs = monthLogs.filter(l => gestIds.includes(l.activityId));
                if (gestLogs.length > 0) {
                    const maxGestScore = Math.max(...gestLogs.map(l => {
                        const act = allActs.find(a => a.id === l.activityId);
                        return act ? act.points : 0;
                    }));
                    totalPointsOverall += maxGestScore;
                }

                totalPointsOverall += staffScore;

                return {
                    isApproved,
                    totalPointsOverall: Math.round(totalPointsOverall * 100) / 100,
                    goalsProgress,
                    missing,
                    staffScore
                };
            };

            const calculateResidentApprovedMonthsCount = (resident, logsList, evaluations, proceduresList = [], config) => {
                const months = new Set(logsList.filter(l => l.residentId === resident.id).map(l => l.date.substring(0, 7)));
                let countFromSystem = 0;
                months.forEach(month => {
                    if (getMonthProgress(resident.id, month, logsList, evaluations, proceduresList, config).isApproved) {
                        countFromSystem++;
                    }
                });
                return (resident.mesesPreviosAprobados || 0) + countFromSystem;

            const getRequiredActivityPts = () => {

            const ProgressBar = ({ label, current, required }) => {

                            </div>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div
                                className={`h-2.5 rounded-full transition-all duration-1000 ease-out ${isComplete ? 'bg-emerald-500' : 'bg-blue-500'}`}
                                style={{ width: `${percentage}%` }}
                            ></div>
                        </div>
                    </div>
                );
            };

            const DashboardView = ({ currentResident, currentMonthYYYYMM, logs, evaluations, procedures, onUpdateProfile, medicosPlanta, config }) => {

                    return { name: 'Año 4 (R4)', bg: 'bg-purple-600', text: 'text-purple-600', bar: 'bg-purple-500', label: 'Cuarto Año' };

                const yearTheme = getYearTheme(totalApprovedMonths);
                const overallPercentage = Math.min(100, Math.round((totalApprovedMonths / 48) * 100));

                const todayDay = new Date().getDate();
                const totalActivityPts = progressData.totalPointsOverall - progressData.staffScore;
                const requiredActivityPts = getRequiredActivityPts();
                const completionPercent = Math.min(100, Math.round((totalActivityPts / requiredActivityPts) * 100));
                const isUnder75Percent = todayDay >= 25 && completionPercent < 75;

                const cleanPhone = (currentResident.celular || '').replace(/\D/g, '');
                const waMessage = encodeURIComponent(`Hola ${currentResident.nombre}, te recordamos que al día ${todayDay} registras un ${completionPercent}% del puntaje mensual requerido (${totalActivityPts}/${requiredActivityPts} pts). Por favor completa tus cargas en Escuelita Bicentenario Log.`);
                const waUrl = cleanPhone ? `https://wa.me/549${cleanPhone}?text=${waMessage}` : '#';

                const mailBody = encodeURIComponent(`Estimado/a ${currentResident.nombre} ${currentResident.apellido},\n\nAl día ${todayDay} del mes registras ${totalActivityPts} de ${requiredActivityPts} puntos requeridos (${completionPercent}%). Te solicitamos ingresar a la aplicación y registrar las actividades faltantes.\n\nAtentamente,\nEscuelita Bicentenario Log`);

                return (

                        {isEditingProfile && (

            const LogActivityView = ({ currentResident, onAddLog, publishedClasses, onPublishClass, logs, isUserDisabled, procedures, config }) => {

                const [plantaActivityId, setPlantaActivityId] = useState(config.planta[0]?.id || '');
                const [timeIn, setTimeIn] = useState('08:00');
                const [timeOut, setTimeOut] = useState('16:00');
                const [plantaDate, setPlantaDate] = useState(new Date().toISOString().split('T')[0]);
                const [plantaError, setPlantaError] = useState('');

                const todayStr = useMemo(() => {

                const minPlantaDateStr = useMemo(() => {

                const [guardiaActivityId, setGuardiaActivityId] = useState(config.guardia[0]?.id || '');

                const [procedureDate, setProcedureDate] = useState(new Date().toISOString().split('T')[0]);

                const [otraQty, setOtraQty] = useState(1);
                const [otraDate, setOtraDate] = useState(new Date().toISOString().split('T')[0]);

                const [indicadorName, setIndicadorName] = useState('');
                const [gestActivityId, setGestActivityId] = useState(config.gestion[0]?.id || '');
                const [gestTargetMonth, setGestTargetMonth] = useState(currentMonthYYYYMM);
                const [gestDate, setGestDate] = useState(new Date().toISOString().split('T')[0]);

                useEffect(() => {
                    if (procedures.length > 0 && !selectedProcedureId) {
                        setSelectedProcedureId(procedures[0].id);
                    }
                }, [procedures]);

                useEffect(() => {
                    if (config.planta.length > 0 && !plantaActivityId) setPlantaActivityId(config.planta[0].id);
                    if (config.guardia.length > 0 && !guardiaActivityId) setGuardiaActivityId(config.guardia[0].id);
                    if (config.otras_actividades.length > 0 && !otraActivityId) setOtraActivityId(config.otras_actividades[0].id);
                    if (config.gestion.length > 0 && !gestActivityId) setGestActivityId(config.gestion[0].id);
                }, [config]);

                const recentClasses = useMemo(() => {
                    const now = new Date();
                    const sevenDaysAgo = new Date(now.setDate(now.getDate() - 7));
                    return publishedClasses.filter(c => new Date(c.date) >= sevenDaysAgo && c.instructorId !== currentResident.id);
                }, [publishedClasses, currentResident]);

                const triggerFeedback = (btnId) => {
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        const original = btn.innerText;
                        btn.classList.add('bg-emerald-600');
                        btn.innerText = '¡Registrado con éxito!';
                        setTimeout(() => {
                            btn.classList.remove('bg-emerald-600');
                            btn.innerText = original;
                        }, 1500);
                    }
                };

                const handlePlantaSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled) return;

                    if (plantaDate < minPlantaDateStr) {
                        setPlantaError('La asistencia a actividad de planta solo puede registrarse hasta 7 días posteriores a la fecha en que se realizó.');
                        return;
                    }
                    if (plantaDate > todayStr) {
                        setPlantaError('No se puede registrar una fecha futura.');
                        return;
                    }
                    setPlantaError('');

                    onAddLog({ residentId: currentResident.id, activityId: plantaActivityId, qty: 1, date: plantaDate, timeIn, timeOut });
                    triggerFeedback('btn-planta');
                };

                const handleGuardiaSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled) return;
                    onAddLog({ residentId: currentResident.id, activityId: guardiaActivityId, qty: 1, date: guardiaDate, service });
                    triggerFeedback('btn-guardia');
                };

                const handleProcedureSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled || !selectedProcedureId) return;
                    const proc = procedures.find(p => p.id === selectedProcedureId);
                    onAddLog({
                        residentId: currentResident.id,
                        activityId: selectedProcedureId,
                        qty: procedureQty,
                        date: procedureDate,
                        procedureName: proc ? proc.name : 'Procedimiento',
                        complexity: proc ? proc.complexity : 'baja'
                    });
                    triggerFeedback('btn-proc');
                };

                const handleDictadaSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled || !classNameInput.trim()) return;

                    const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    onAddLog({
                        residentId: currentResident.id,
                        activityId: dictadaType,
                        qty: 1,
                        date: dictadaDate,
                        className: classNameInput,
                        time: nowTime
                    });

                    onPublishClass({
                        id: 'class_' + Date.now(),
                        title: classNameInput,
                        instructorId: currentResident.id,
                        instructorName: `${currentResident.nombre} ${currentResident.apellido}`,
                        date: dictadaDate,
                        time: nowTime
                    });

                    setClassNameInput('');
                    triggerFeedback('btn-dictada');
                };

                const handleEscuchadaSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled) return;
                    if (escuchadaMode === 'class') {
                        if (!selectedPublishedClassId) return;
                        const pubClass = publishedClasses.find(c => c.id === selectedPublishedClassId);

                        onAddLog({
                            residentId: currentResident.id,
                            activityId: 'ce_dictada',
                            qty: 1,
                            date: escuchadaDate,
                            className: pubClass ? pubClass.title : 'Clase escuchada'
                        });
                    } else {
                        onAddLog({
                            residentId: currentResident.id,
                            activityId: 'ce_lectura',
                            qty: 1,
                            date: escuchadaDate,
                            topic: lecturaTopic
                        });
                        setLecturaTopic('');
                    }
                    triggerFeedback('btn-escuchada');
                };

                const handleOtraSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled) return;
                    onAddLog({ residentId: currentResident.id, activityId: otraActivityId, qty: otraQty, date: otraDate });
                    triggerFeedback('btn-otra');
                };

                const handleGestSubmit = (e) => {
                    e.preventDefault();
                    if (isUserDisabled) return;

                    let finalDate = gestDate;
                    if (!finalDate.startsWith(gestTargetMonth)) {
                        finalDate = `${gestTargetMonth}-28`;

                    onAddLog({

                        activityId: gestActivityId,

                        date: finalDate,
                        indicatorName: indicadorName || 'Indicador de Gestión'

                    setIndicadorName('');
                    triggerFeedback('btn-gest');
                };

                return (
                    <div className="p-4 fade-in">
                        <div className="mb-4">

                            <p className="text-slate-500 text-xs">Selecciona la solapa correspondiente para registrar tus actividades.</p>

                const [doctorTab, setDoctorTab] = useState('alumnos'); // alumnos | auditoria | procedimientos

                const myResidents = useMemo(() => {
                    return residents.filter(r => r.medicoPlanta === currentStaffDoctor);
                }, [residents, currentStaffDoctor]);

                const unassignedResidents = useMemo(() => {
                    return residents.filter(r => r.medicoPlanta !== currentStaffDoctor);
                }, [residents, currentStaffDoctor]);

                const [selectedResidentId, setSelectedResidentId] = useState(myResidents[0]?.id || '');
                const [selectedMonth, setSelectedMonth] = useState(currentMonthYYYYMM);

                const [newProcName, setNewProcName] = useState('');
                const [newProcComplexity, setNewProcComplexity] = useState('baja');

                // Asegurar que si el médico cambia de tab o agrega un alumno, el select tenga un valor válido
                useEffect(() => {
                    if (myResidents.length > 0 && !myResidents.some(r => r.id === selectedResidentId)) {
                        setSelectedResidentId(myResidents[0].id);
                    }
                }, [myResidents, selectedResidentId]);

                const selectedResident = residents.find(r => r.id === selectedResidentId) || myResidents[0];

                const evalKey = `${selectedResidentId}_${selectedMonth}`;
                const evalObj = evaluations[evalKey] || {};
                const currentScore = typeof evalObj === 'object' ? (evalObj?.score || 0) : (Number(evalObj) || 0);
                const currentEvaluator = typeof evalObj === 'object' ? evalObj?.evaluatedBy : (evalObj ? 'Médico de Planta' : null);

                const isGradedByOther = Boolean(currentEvaluator && currentEvaluator !== currentStaffDoctor);

                const isDateAllowed = useMemo(() => {
                    if (selectedMonth < currentMonthYYYYMM) return true;
                    if (selectedMonth === currentMonthYYYYMM) return new Date().getDate() >= 25;
                    return false;
                }, [selectedMonth]);

                const isEvaluationAllowed = isDateAllowed && !isGradedByOther;
                const [tempScore, setTempScore] = useState(currentScore);

                useEffect(() => { setTempScore(currentScore); }, [evalKey, evaluations, currentScore]);

                const residentLogsForMonth = useMemo(() => {
                    if (!selectedResidentId) return [];
                    return logs.filter(l => l.residentId === selectedResidentId && l.date.startsWith(selectedMonth));
                }, [logs, selectedResidentId, selectedMonth]);

                const progressData = useMemo(() => {
                    if (!selectedResidentId) return null;
                    return getMonthProgress(selectedResidentId, selectedMonth, logs, evaluations, procedures, config);
                }, [selectedResidentId, selectedMonth, logs, evaluations, procedures, config]);

                const handleSaveScoreSubmit = (e) => {
                    e.preventDefault();
                    if (!isEvaluationAllowed) return;
                    onSaveEvaluation(selectedResidentId, selectedMonth, parseInt(tempScore), currentStaffDoctor);
                };

                const handleCreateProcedure = (e) => {
                    e.preventDefault();
                    if (!newProcName.trim()) return;

            const AuthView = ({ onRegister }) => {
                const [mode, setMode] = useState('login');

                const [registerRole, setRegisterRole] = useState('alumno');
                const [registerTipo, setRegisterTipo] = useState('Residente');
                const [registerNombre, setRegisterNombre] = useState('');
                const [registerApellido, setRegisterApellido] = useState('');
                const [registerMail, setRegisterMail] = useState('');
                const [registerCelular, setRegisterCelular] = useState('');
                const [errorMsg, setErrorMsg] = useState('');
                const [isSubmitting, setIsSubmitting] = useState(false);

                // Firebase Auth valida el DNI+contraseña del lado del servidor: acá ya
                // no se compara ni se guarda ninguna contraseña en texto plano.
                const handleLoginSubmit = async (e) => {
                    e.preventDefault();
                    setErrorMsg('');
                    setIsSubmitting(true);
                    try {
                        await auth.signInWithEmailAndPassword(dniToPseudoEmail(dni), password);
                    } catch (err) {
                        setErrorMsg('DNI o contraseña incorrectos.');
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                const handleRegisterSubmit = async (e) => {
                    e.preventDefault();
                    setErrorMsg('');
                    setIsSubmitting(true);

                    const newUser = {
                        dni: dni.trim(), role: registerRole,
                        name: `${registerNombre} ${registerApellido}`.trim(),
                        residentId: registerRole === 'alumno' ? 'r_' + Date.now() : null,
                        doctorName: registerRole === 'medico' ? `${registerNombre} ${registerApellido}` : null,
                        disabled: false
                    };

                    try {
                        await auth.createUserWithEmailAndPassword(dniToPseudoEmail(dni), password);
                    } catch (err) {
                        setErrorMsg(err.code === 'auth/email-already-in-use' ? 'Ese DNI ya está registrado.' : 'No se pudo crear la cuenta (la contraseña necesita al menos 6 caracteres).');
                        setIsSubmitting(false);
                        return;
                    }

                    onRegister(newUser, { nombre: registerNombre, apellido: registerApellido, dni: dni.trim(), mail: registerMail, celular: registerCelular, tipo: registerTipo });
                    setIsSubmitting(false);
                };

                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-6 slide-up">
                            <div className="text-center space-y-2">

                            {errorMsg && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl font-semibold">{errorMsg}</div>}

                            <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl text-xs font-bold">
                                <button type="button" onClick={() => { setMode('login'); setErrorMsg(''); }} className={`py-2.5 rounded-lg ${mode === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>Iniciar Sesión</button>
                                <button type="button" onClick={() => { setMode('register'); setErrorMsg(''); }} className={`py-2.5 rounded-lg ${mode === 'register' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>Registrarse</button>
                            </div>

                            {mode === 'login' ? (
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    <input type="text" placeholder="DNI (Usuario)" value={dni} onChange={e => setDni(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold outline-none" />
                                    <input type="password" placeholder="Contraseña" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold outline-none" />
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 text-white font-bold p-4 rounded-xl text-xs disabled:opacity-50">{isSubmitting ? 'Ingresando...' : 'Ingresar al Sistema'}</button>
                                </form>
                            ) : (
                                <form onSubmit={handleRegisterSubmit} className="space-y-3">
                                    <select value={registerRole} onChange={e => setRegisterRole(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold outline-none">
                                        <option value="alumno">Alumno / Residente</option><option value="medico">Médico de Planta</option>

                                    {registerRole === 'alumno' && (
                                        <select value={registerTipo} onChange={e => setRegisterTipo(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold outline-none">

                                        </select>
                                    )}
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder="Nombre" value={registerNombre} onChange={e => setRegisterNombre(e.target.value)} required className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />

                                    </div>
                                    {registerRole === 'alumno' && (
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="email" placeholder="Mail" value={registerMail} onChange={e => setRegisterMail(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />
                                            <input type="tel" placeholder="Celular" value={registerCelular} onChange={e => setRegisterCelular(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm" />
                                        </div>
                                    )}
                                    <input type="text" placeholder="DNI (Será su Usuario)" value={dni} onChange={e => setDni(e.target.value)} required className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold" />
                                    <input type="password" placeholder="Contraseña (mín. 6 caracteres)" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} className="w-full bg-slate-50 border rounded-xl p-2.5 text-sm font-bold" />
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-emerald-600 text-white font-bold p-3.5 rounded-xl text-xs disabled:opacity-50">{isSubmitting ? 'Creando...' : 'Crear Cuenta'}</button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            };

            const App = () => {
                const [loadingInitial, setLoadingInitial] = useState(true);
                const [systemUsers, setSystemUsers] = useState([]);
                const [residents, setResidents] = useState([]);
                const [procedures, setProcedures] = useState([]);
                const [logs, setLogs] = useState([]);
                const [publishedClasses, setPublishedClasses] = useState([]);
                const [evaluations, setEvaluations] = useState({});
                const [config, setConfig] = useState(DEFAULT_ACTIVITIES_CONFIG);

                const [currentUser, setCurrentUser] = useState(null);
                const [activeTab, setActiveTab] = useState('dashboard');
                const [idleNotice, setIdleNotice] = useState(false);

                const inactivityTimerRef = useRef(null);
                const [authUser, setAuthUser] = useState(undefined); // undefined = todavía no se sabe, null = sin sesión

                // Los médicos de planta se deducen dinámicamente de los usuarios reales.
                const medicosPlanta = useMemo(() => {
                    return systemUsers.filter(u => u.role === 'medico').map(u => u.name);
                }, [systemUsers]);

                // =========================================================================
                // ESTADO DE SESIÓN (Firebase Auth)
                // =========================================================================
                useEffect(() => {
                    const unsubAuth = auth.onAuthStateChanged(u => {
                        setAuthUser(u);
                        if (!u) setLoadingInitial(false);
                    });
                    return () => unsubAuth();
                }, []);

                // =========================================================================
                // FIREBASE REALTIME SYNC — recién arranca cuando hay sesión iniciada.
                // Antes de loguearse, las reglas de Firestore no dejan leer nada (ver
                // firestore.rules), así que no tiene sentido intentarlo.
                // =========================================================================
                useEffect(() => {
                    if (!authUser) return;
                    setLoadingInitial(true);
                    const safetyTimer = setTimeout(() => { setLoadingInitial(false); }, 6000);

                    const unsubConfig = db.collection('settings').doc('activities').onSnapshot(snap => { if(snap.exists) setConfig(snap.data()); });
                    const unsubUsers = db.collection('users').onSnapshot(snap => setSystemUsers(snap.docs.map(doc => doc.data())));
                    const unsubResidents = db.collection('residents').onSnapshot(snap => setResidents(snap.docs.map(doc => doc.data())));
                    const unsubProcedures = db.collection('procedures').onSnapshot(snap => setProcedures(snap.docs.map(doc => doc.data())));
                    const unsubLogs = db.collection('logs').onSnapshot(snap => setLogs(snap.docs.map(doc => doc.data())));
                    const unsubClasses = db.collection('classes').onSnapshot(snap => setPublishedClasses(snap.docs.map(doc => doc.data())));
                    const unsubEvaluations = db.collection('evaluations').onSnapshot(snap => {
                        const evals = {};
                        snap.docs.forEach(doc => { evals[doc.id] = doc.data(); });
                        setEvaluations(evals);
                        clearTimeout(safetyTimer);
                        setLoadingInitial(false);
                    }, err => {
                        console.error(err);
                        clearTimeout(safetyTimer);
                        setLoadingInitial(false);
                    });

                    return () => {
                        clearTimeout(safetyTimer);
                        unsubConfig(); unsubUsers(); unsubResidents(); unsubProcedures(); unsubLogs(); unsubClasses(); unsubEvaluations();
                    };
                }, [authUser]);

                const resetInactivityTimer = () => {
                    if (inactivityTimerRef.current) clearTimeout(inactivityTimerRef.current);
                    if (currentUser) {
                        inactivityTimerRef.current = setTimeout(() => {
                            handleLogout();
                            setIdleNotice(true);
                        }, 180000);
                    }
                };

                useEffect(() => {
                    const events = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
                    const handleUserActivity = () => resetInactivityTimer();
                    events.forEach(ev => window.addEventListener(ev, handleUserActivity));
                    resetInactivityTimer();
                    return () => {
                        if (inactivityTimerRef.current) clearTimeout(inactivityTimerRef.current);
                        events.forEach(ev => window.removeEventListener(ev, handleUserActivity));
                    };
                }, [currentUser?.dni]);

                // El usuario logueado se deduce de la sesión real de Firebase Auth + su
                // perfil en Firestore (ya no hay contraseñas guardadas ni comparadas a mano).
                useEffect(() => {
                    if (!authUser) { setCurrentUser(null); return; }
                    const match = systemUsers.find(u => dniToPseudoEmail(u.dni) === authUser.email);
                    if (match) setCurrentUser(match);
                }, [authUser, systemUsers]);

                // Si una cuenta de acceso queda huérfana (p.ej. el Admin borró al usuario
                // pero la sesión de ese celular seguía abierta) nunca aparece un perfil:
                // sin este corte se quedaría mirando "Conectando..." para siempre.
                useEffect(() => {
                    if (!authUser) return;
                    const timer = setTimeout(() => {
                        setCurrentUser(prev => {
                            if (!prev) {
                                auth.signOut();
                                alert('No se encontró tu perfil. Puede que tu cuenta haya sido eliminada; contactá al administrador.');
                            }
                            return prev;
                        });
                    }, 10000);
                    return () => clearTimeout(timer);
                }, [authUser]);

                useEffect(() => {
                    if (!currentUser) return;
                    setIdleNotice(false);
                    setActiveTab(currentUser.role === 'medico' ? 'medico_planta' : currentUser.role === 'admin' ? 'admin' : 'dashboard');
                }, [currentUser?.dni]);

                const isCurrentDisabled = useMemo(() => {
                    if (!currentUser) return false;
                    const match = systemUsers.find(u => u.dni === currentUser.dni);
                    return match ? Boolean(match.disabled) : false;
                }, [currentUser, systemUsers]);

                const activeResident = useMemo(() => {
                    if (!currentUser || currentUser.role !== 'alumno') return residents[0] || {};
                    return residents.find(r => r.id === currentUser.residentId || r.dni === currentUser.dni) || {};
                }, [currentUser, residents]);

                const activeStaffDoctor = useMemo(() => {
                    if (!currentUser || currentUser.role !== 'medico') return medicosPlanta[0] || '';
                    return currentUser.doctorName || currentUser.name || medicosPlanta[0] || '';
                }, [currentUser, medicosPlanta]);

                if (loadingInitial || (authUser && !currentUser)) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-slate-900">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl text-center space-y-4">
                                <div className="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-600 text-white font-black text-xl animate-pulse">E</div>
                                <div className="text-slate-800 text-xs font-bold tracking-widest uppercase animate-pulse">Conectando...</div>
                            </div>
                        </div>
                    );
                }

                const handleLogout = () => auth.signOut();

                // =========================================================================
                // FUNCIONES DE ESCRITURA EN FIREBASE
                // =========================================================================
                const handleToggleUserStatus = (userDni) => {
                    const user = systemUsers.find(u => u.dni === userDni);
                    if(user) db.collection('users').doc(userDni).update({ disabled: !user.disabled });
                };

                // ponytail: esto borra el perfil (Firestore) pero no la cuenta de acceso
                // (Firebase Auth) — borrar la cuenta de otra persona requiere Admin SDK /
                // Cloud Functions, que este proyecto no tiene por no usar backend propio.
                // Si esa persona vuelve a entrar sin perfil, se la desloguea sola a los
                // 10s (ver el useEffect de "cuenta huérfana" en App). Upgrade: una Cloud
                // Function que borre también el usuario de Auth al borrar el doc.
                const handleDeleteUser = (userDni, residentId) => {
                    db.collection('users').doc(userDni).delete();
                    if (residentId) {
                        db.collection('residents').doc(residentId).delete();
                        db.collection('logs').where('residentId', '==', residentId).get().then(snap => {
                            snap.forEach(doc => doc.ref.delete());
                        });
                    }
                };

                const handleRegisterUser = (newUser, newResData) => {
                    const { password: _pw, ...userProfile } = newUser; // la contraseña vive solo en Firebase Auth, nunca en Firestore
                    db.collection('users').doc(newUser.dni).set({ ...userProfile, disabled: false });
                    if (newUser.role === 'alumno') {
                        const newRes = {
                            id: newUser.residentId, nombre: newResData.nombre, apellido: newResData.apellido,
                            dni: newResData.dni, mail: newResData.mail || '', celular: newResData.celular || '',
                            universidad: 'UBA', fechaIngreso: new Date().toISOString().split('T')[0],
                            tipo: newResData.tipo || 'Residente', medicoPlanta: medicosPlanta.length > 0 ? medicosPlanta[0] : '',
                            burbuja: 'A', mesesPreviosAprobados: 0
                        };
                        db.collection('residents').doc(newRes.id).set(newRes);
                    }
                };

                const handleAddLog = (newLog) => {
                    if (isCurrentDisabled) return;
                    const id = Date.now().toString();
                    db.collection('logs').doc(id).set({ ...newLog, id, anulado: false });
                };

                const handleToggleAnularLog = (logId, userWhoAnnulled) => {
                    const log = logs.find(l => l.id === logId);
                    if (log) {
                        db.collection('logs').doc(logId.toString()).update({
                            anulado: !log.anulado,
                            anuladoPor: !log.anulado ? userWhoAnnulled : null
                        });
                    }
                };

                const handlePublishClass = (newClass) => {
                    if (isCurrentDisabled) return;
                    db.collection('classes').doc(newClass.id.toString()).set(newClass);
                };

                const handleAddResident = async (newRes) => {
                    try {
                        await createAuthAccountWithoutSignIn(newRes.dni, '123456');
                    } catch (err) {
                        alert('No se pudo crear el acceso del alumno: ' + err.message);
                        return;
                    }
                    db.collection('residents').doc(newRes.id).set(newRes);
                    db.collection('users').doc(newRes.dni).set({
                        dni: newRes.dni, role: 'alumno', name: `${newRes.nombre} ${newRes.apellido}`, residentId: newRes.id, disabled: false
                    });
                };

                const handleAddMedicoPlanta = async (medicoData) => {
                    try {
                        await createAuthAccountWithoutSignIn(medicoData.dni, medicoData.password);
                    } catch (err) {
                        alert('No se pudo crear el acceso del médico: ' + err.message);
                        return;
                    }
                    db.collection('users').doc(medicoData.dni).set({
                        dni: medicoData.dni,
                        role: 'medico',
                        name: medicoData.name,
                        disabled: false
                    });
                };

                const handleAddProcedure = (newProc) => {
                    db.collection('procedures').doc(newProc.id).set(newProc);
                };

                const handleDeleteProcedure = (procId) => {
                    db.collection('procedures').doc(procId).delete();
                };

                const handleUpdateProcedureComplexity = (procId, newComplexity) => {
                    db.collection('procedures').doc(procId).update({
                        complexity: newComplexity, points: newComplexity === 'alta' ? 0.2 : 0.1
                    });
                };

                const handleSaveEvaluation = (residentId, month, score, evaluatorName) => {
                    const evalKey = `${residentId}_${month}`;
                    db.collection('evaluations').doc(evalKey).set({
                        score: parseInt(score), evaluatedBy: evaluatorName || activeStaffDoctor
                    });
                };

                const handleAssignResident = (residentId, field, value) => {
                    db.collection('residents').doc(residentId).update({ [field]: value });
                };

                const handleUpdateOwnProfile = (residentId, updatedFields) => {
                    db.collection('residents').doc(residentId).update(updatedFields);
                };

                // El DNI es de solo lectura en el panel de edición (ver AdminView) porque
                // es el usuario de acceso en Firebase Auth y no se puede renombrar desde
                // el cliente sin un backend. Por eso acá el doc de users nunca cambia de id.
                const handleAdminUpdateResident = (originalDni, updatedData) => {
                    const fullName = `${updatedData.nombre} ${updatedData.apellido}`.trim();

                    if (updatedData.residentId) {
                        const { originalDni: _omit, residentId, role, ...residentFields } = updatedData;
                        db.collection('residents').doc(residentId).update(residentFields);
                    }

                    db.collection('users').doc(originalDni).update({ name: fullName });
                };

                const handleUpdateConfig = (newConfig) => {
                    db.collection('settings').doc('activities').set(newConfig);
                };

                if (!currentUser) {
                    return (
                        <div>
                            {idleNotice && <div className="bg-amber-500 text-white text-xs font-bold p-2 text-center sticky top-0 z-50">🔒 Sesión cerrada automáticamente por pasar 3 minutos sin actividad.</div>}
                            <AuthView onRegister={handleRegisterUser} />
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col max-w-md mx-auto bg-slate-50 relative shadow-2xl">
                        <header className="bg-slate-900 text-white px-4 py-3 sticky top-0 z-20 shadow-md">
                            <div className="flex justify-between items-center mb-2">
                                <div className="font-black text-lg text-white tracking-tight flex items-center gap-2 min-w-0">
                                    <span className="bg-blue-600 text-white rounded-lg w-7 h-7 flex items-center justify-center text-sm shrink-0">E</span>
                                    <span className="truncate">Escuelita Log</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold uppercase ${currentUser.role === 'admin' ? 'bg-amber-500 text-slate-900' : currentUser.role === 'medico' ? 'bg-indigo-600 text-white' : 'bg-blue-600 text-white'}`}>
                                        {currentUser.role === 'admin' ? 'Admin' : currentUser.role === 'medico' ? 'Médico Planta' : 'Alumno'}
                                    </span>
                                    <button onClick={handleLogout} className="bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white p-1.5 rounded-lg transition-all">{Icons.LogOut}</button>
                                </div>
                            </div>
                            <div className="bg-slate-800/80 px-3 py-1.5 rounded-xl text-xs flex justify-between items-center">
                                <div className="flex items-center gap-1.5"><span className="text-slate-400">{Icons.User}</span><span className="font-bold text-white">{currentUser.name}</span></div>
                                <span className="text-[10px] text-slate-400 font-mono">DNI: {currentUser.dni}</span>
                            </div>
                        </header>

                        <main className="flex-grow">
                            {currentUser.role === 'medico' && activeTab === 'medico_planta' && <MedicoPlantaView currentStaffDoctor={activeStaffDoctor} residents={residents} logs={logs} evaluations={evaluations} onSaveEvaluation={handleSaveEvaluation} onToggleAnularLog={handleToggleAnularLog} activeRole={currentUser.role} procedures={procedures} onAddProcedure={handleAddProcedure} medicosPlanta={medicosPlanta} onAssignResident={handleAssignResident} config={config} />}
                            {activeTab === 'dashboard' && currentUser.role === 'alumno' && <DashboardView currentResident={activeResident} currentMonthYYYYMM={currentMonthYYYYMM} logs={logs} evaluations={evaluations} procedures={procedures} onUpdateProfile={handleUpdateOwnProfile} medicosPlanta={medicosPlanta} config={config} />}
                            {activeTab === 'log' && <LogActivityView currentResident={activeResident} onAddLog={handleAddLog} publishedClasses={publishedClasses} onPublishClass={handlePublishClass} logs={logs} isUserDisabled={isCurrentDisabled} procedures={procedures} config={config} />}
                            {activeTab === 'report' && <ReportView logs={logs} residents={residents} evaluations={evaluations} onSaveEvaluation={handleSaveEvaluation} activeRole={currentUser.role} currentStaffDoctor={activeStaffDoctor} onToggleAnularLog={handleToggleAnularLog} procedures={procedures} config={config} />}
                            {activeTab === 'admin' && <AdminView residents={residents} onAddResident={handleAddResident} medicosPlanta={medicosPlanta} onAddMedicoPlanta={handleAddMedicoPlanta} systemUsers={systemUsers} onToggleUserStatus={handleToggleUserStatus} onDeleteUser={handleDeleteUser} logs={logs} onToggleAnularLog={handleToggleAnularLog} procedures={procedures} onAddProcedure={handleAddProcedure} onDeleteProcedure={handleDeleteProcedure} onChangeProcedureComplexity={handleUpdateProcedureComplexity} onAssignResident={handleAssignResident} onUpdateResident={handleAdminUpdateResident} config={config} onUpdateConfig={handleUpdateConfig} />}
                        </main>

                        <nav className="fixed bottom-0 w-full max-w-md bg-white border-t border-slate-200 flex justify-around p-2 pb-safe z-30 shadow-2xl">
                            {currentUser.role === 'medico' ? (
                                <>
                                    <button onClick={() => setActiveTab('medico_planta')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'medico_planta' ? 'text-indigo-600 font-bold' : 'text-slate-400'}`}>{Icons.User}<span className="text-[10px] font-bold mt-1">Alumnos a Cargo</span></button>
                                    <button onClick={() => setActiveTab('report')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'report' ? 'text-indigo-600 font-bold' : 'text-slate-400'}`}>{Icons.Report}<span className="text-[10px] font-bold mt-1">Reporte Institucional</span></button>
                                </>
                            ) : currentUser.role === 'admin' ? (
                                <>
                                    <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'admin' ? 'text-amber-600 font-bold' : 'text-slate-400'}`}>{Icons.Dashboard}<span className="text-[10px] font-bold mt-1">Administración</span></button>
                                    <button onClick={() => setActiveTab('medico_planta')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'medico_planta' ? 'text-amber-600 font-bold' : 'text-slate-400'}`}>{Icons.User}<span className="text-[10px] font-bold mt-1">Supervisión Planta</span></button>
                                    <button onClick={() => setActiveTab('report')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'report' ? 'text-amber-600 font-bold' : 'text-slate-400'}`}>{Icons.Report}<span className="text-[10px] font-bold mt-1">Reporte General</span></button>
                                </>
                            ) : (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>{Icons.Dashboard}<span className="text-[10px] font-bold mt-1">Mi Progreso</span></button>
                                    <div className="relative -top-5"><button onClick={() => setActiveTab('log')} className={`flex items-center justify-center w-14 h-14 rounded-full text-white shadow-xl transition-transform transform active:scale-95 ${activeTab === 'log' ? 'bg-blue-700 scale-105 ring-4 ring-blue-100' : 'bg-blue-600'}`}>{Icons.Plus}</button></div>
                                    <button onClick={() => setActiveTab('report')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'report' ? 'text-blue-600' : 'text-slate-400'}`}>{Icons.Report}<span className="text-[10px] font-bold mt-1">Reporte</span></button>
                                </>
                            )}
                        </nav>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );

        } catch (fatalError) {
            window.addEventListener('DOMContentLoaded', () => {
                const errorBox = document.getElementById('error-box');
                const errorMsg = document.getElementById('error-message');
                if (errorBox && errorMsg) {
                    errorBox.style.display = 'block';
                    errorMsg.innerHTML += `<b>Error Inicial Crítico:</b> ${fatalError.message}`;
                    console.error(fatalError);
                }
            });
        }
    </script>
</body>
</html>
